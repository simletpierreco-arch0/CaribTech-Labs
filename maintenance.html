<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We'll be right back — {{ settings.company_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<section class="hero" style="min-height:100vh;display:flex;align-items:center;">
  <div class="container text-center">
    <img src="{{ url_for('static', filename=settings.logo_path) }}" alt="{{ settings.company_name }}" style="height:44px;margin:0 auto 28px;" onerror="this.style.display='none'">
    <h1>We'll be right back</h1>
    <p style="max-width:480px;margin:0 auto;">{{ settings.company_name }} is currently undergoing scheduled maintenance. Thanks for your patience — check back shortly.</p>
  </div>
</section>
</body>
</html>
